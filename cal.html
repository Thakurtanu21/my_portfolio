<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="cal.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" disabled>
        <div class="buttons">
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button operator">/</button>
            <button class="button operator">sin</button>
            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button operator">*</button>
            <button class="button operator">cos</button>
            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button operator">-</button>
            <button class="button operator">tan</button>
            <button class="button">0</button>
            <button class="button">.</button>
            <button class="button operator">+</button>
            <button class="button operator">=</button>
            <button class="button operator">log</button>
            <button class="button operator">%</button>
            <button class="button">00</button>
            <button class="button operator">AC</button>
            <button class="button operator">DEL</button>
            <style>
                .button.operator.del {
                    background-color: red;
                    color: white;
                }
            </style>
            <button class="button operator">inv</button>
            <button class="button operator">e</button>
            <button class="button operator">π</button>
            <button class="button operator">√</button>
            <button class="button operator">^</button>
            <button class="button operator">(</button>
            <button class="button operator">)</button>
            <button class="button operator">rad</button>
            <button class="button operator">exp</button>
            <button class="button operator">ln</button>
            <button class="button operator">abs</button>
        </div>
    </div>
    <script src="cal.js"></script>
    <script>
        const display = document.querySelector('.display');
        const buttons = document.querySelectorAll('.button');
        let currentInput = '';

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.textContent;

                if (value === '=') {
                    try {
                        currentInput = eval(currentInput);
                    } catch {
                        currentInput = 'Error';
                    }
                } else if (value === 'sin') {
                    currentInput = Math.sin(parseFloat(currentInput)).toString();
                } else if (value === 'cos') {
                    currentInput = Math.cos(parseFloat(currentInput)).toString();
                } else if (value === 'tan') {
                    currentInput = Math.tan(parseFloat(currentInput)).toString();
                } else if (value === 'log') {
                    currentInput = Math.log10(parseFloat(currentInput)).toString();
                    } else if (value === '%') {
                        currentInput = (parseFloat(currentInput) / 100).toString();
                    } else if (value === '00') {
                        currentInput += '00';
                    } else if (value === 'AC') {
                        currentInput = '';
                    } else if (value === 'DEL') {
                        currentInput = currentInput.slice(0, -1);
                        } else if (value === 'inv') {
                            currentInput = (1 / parseFloat(currentInput)).toString();
                        } else if (value === 'e') {
                            currentInput = Math.E.toString();
                        } else if (value === 'π') {
                            currentInput = Math.PI.toString();
                        } else if (value === '√') {
                            currentInput = Math.sqrt(parseFloat(currentInput)).toString();
                        } else if (value === '^') {
                            currentInput += '**';
                        } else if (value === '(') {
                            currentInput += '(';
                        } else if (value === ')') {
                            currentInput += ')';
                            } else if (value === 'rad') {
                                currentInput = (parseFloat(currentInput) * (Math.PI / 180)).toString();
                            } else if (value === 'exp') {
                                currentInput = Math.exp(parseFloat(currentInput)).toString();
                            } else if (value === 'ln') {
                                currentInput = Math.log(parseFloat(currentInput)).toString();
                            } else if (value === 'abs') {
                                currentInput = Math.abs(parseFloat(currentInput)).toString();
                } else {
                    currentInput += value;
                }

                display.value = currentInput;
            });
        });
    </script>
</body>
</html>
